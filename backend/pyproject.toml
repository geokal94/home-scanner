[tool.poetry]
name = "home-scanner"
version = "0.1.0"
description = "Telegram alerts for new Greek apartment rentals on spitogatos.gr"
authors = ["Giorgos Kallis <giorgos.kallis.gr@gmail.com>"]
readme = "../README.md"
package-mode = true
packages = [{include = "home_scanner"}]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27"
beautifulsoup4 = "^4.12"
sqlalchemy = "^2.0"
alembic = "^1.13"
"psycopg[binary]" = "^3.2"
"python-telegram-bot" = {extras = ["job-queue"], version = "^21"}
tenacity = "^9.0"
pyyaml = "^6.0"
rapidfuzz = "^3.10"
structlog = "^24.4"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
respx = "^0.22"
"testcontainers" = {extras = ["postgresql"], version = "^4.8"}
ruff = "^0.8"
mypy = "^1.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
