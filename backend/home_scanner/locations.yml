# Greek apartment search locations.
#
# `slug` here holds the **Google Place ID** that xe.gr uses in its
# `geo_place_ids[]` query parameter. `url_slug` is the URL-safe identifier
# used in the frontend at /listings/<url_slug>. To add a new location: search
# for it at xe.gr, copy the Place ID from the URL, pick a stable lowercase
# url_slug (Latin script, hyphens, no Greek accents).

